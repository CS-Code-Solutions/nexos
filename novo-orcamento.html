<html lang="pt-BR">
<head>

      document.write('<style>#logo-cliente { content: url("' + logoSalva + '"); }</style>');
    }
  })();
</script>

  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexOS - Novo Orçamento</title>

  <script src="global-modal.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-init.js?v=2"></script>
  <script src="firebase-sync.js?v=2"></script>

  <style>
    .desktop-nav { display: flex; align-items: center; gap: 20px; }
    .desktop-nav a { color: #94A3B8; text-decoration: none; font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    .desktop-nav a:hover, .desktop-nav a.active { color: #00F5D4; }
    @media (max-width: 768px) { .desktop-nav { display: none !important; } }
    @media (min-width: 769px) { #mainBottomNav { display: none !important; } }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Estilização para garantir alinhamento limpo das checkboxes no mobile */
    .checkbox-row {
      display: flex !important;
      flex-direction: row !important;
      align-items: flex-start !important;
      justify-content: flex-start !important;
      gap: 12px !important;
      font-size: 0.85rem !important;
      color: #334155 !important;
      cursor: pointer !important;
      margin: 0 !important;
      text-align: left !important;
      width: 100% !important;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px !important;
      height: 18px !important;
      margin: 2px 0 0 0 !important;
      flex-shrink: 0 !important;
      cursor: pointer !important;
    }
    .checkbox-row span {
      flex: 1 !important;
      line-height: 1.4 !important;
    }
  </style>
</head>
<body>

  <header class="no-print" style="background-color: #0B132B; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #00F5D4; position: sticky; top: 0; z-index: 100;">
    <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
      <img id="logo-cliente" src="marca.png" alt="NexOS" style="max-height: 35px; width: auto; object-fit: contain;">
    </a>

<nav class="desktop-nav">
      <a href="cadastros.html"><i class="fa-solid fa-address-book"></i> Cadastros</a>
      <a href="relatorios.html" class="active"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
      <a href="manutencoes.html"><i class="fa-solid fa-calendar-check"></i> Planejamento</a>
      <a href="horas-extras.html" id="d-nav-horas"><i class="fa-solid fa-clock"></i> Horas</a>
      <a href="configuracao.html"><i class="fa-solid fa-gear"></i> Config</a>
    </nav>

    <button type="button" onclick="fazerLogout();" style="background: transparent; border: none; color: #EF4444; font-size: 1.4rem; cursor: pointer;" title="Encerrar Sessão">
      <i class="fa-solid fa-power-off"></i>
    </button>
  </header>

  <main style="max-width: 900px; margin: 20px auto; padding: 0 15px; padding-bottom: 80px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 id="formTitle" style="color: #0B132B; margin: 0; font-size: 1.4rem;">Novo Orçamento</h2>
      <a href="relatorios.html" class="btn" style="background-color: #64748B; color: white; text-decoration: none; padding: 8px 14px; font-size: 0.85rem; border-radius: 4px;">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </a>
    </div>

    <section class="card" style="border-top: 4px solid var(--tech-blue, #2563EB); background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
      <form id="budgetForm">
        <input type="hidden" id="editIndex" value="">

        <div class="grid-2" style="margin-bottom: 12px;">
          <div>
            <label for="orcNumber" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Nº do Orçamento:</label>
            <input type="text" id="orcNumber" class="form-control" value="ORC-0001" required style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; margin-top:4px;">
          </div>
          <div>
            <label for="orcDate" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Data:</label>
            <input type="date" id="orcDate" class="form-control" required style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; margin-top:4px;">
          </div>
        </div>

        <div class="grid-2" style="margin-bottom: 12px;">
          <div>
            <label for="orcClient" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Cliente:</label>
            <select id="orcClient" class="form-control" required style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background: #fff; margin-top:4px;"></select>
          </div>
          <div>
            <label for="orcEquipment" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Equipamento / Máquina:</label>
            <input type="text" id="orcEquipment" placeholder="Ex: Laser Amada / SCM" class="form-control" style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; margin-top:4px;">
          </div>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="orcDesc" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Dados do Serviço / Escopo:</label>
          <textarea id="orcDesc" rows="4" placeholder="Descreva os serviços a serem realizados..." style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; font-family:inherit; margin-top:4px;"></textarea>
        </div>

        <div class="grid-2" style="margin-bottom: 14px;">
          <div>
            <label for="orcPaymentOption" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Forma de Recebimento / Conta:</label>
            <select id="orcPaymentOption" class="form-control" required style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background: #FFF; margin-top:4px;">
              <option value="banco1" id="optionBank1Label">Conta Bancária 1</option>
              <option value="banco2" id="optionBank2Label">Conta Bancária 2</option>
              <option value="boleto">Boleto Bancário</option>
            </select>
          </div>
          <div>
            <label for="orcTotal" style="font-weight: bold; font-size: 0.85rem; color: #334155; display: block;">Valor Total (R$):</label>
            <input type="number" step="0.01" id="orcTotal" placeholder="0.00" class="form-control" required style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; margin-top:4px;">
          </div>
        </div>

        <!-- CONDIÇÕES COMERCIAIS ORGANIZADAS -->
        <div style="margin-bottom: 15px;">
          <label style="font-weight: bold; font-size: 0.88rem; color: #0B132B; margin-bottom: 6px; display: block;">Condições Comerciais (Opções Rápidas):</label>
          
          <div style="background: #F8FAFC; border: 1px solid #CBD5E1; padding: 14px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 12px;">
            <label class="checkbox-row">
              <input type="checkbox" class="term-check" value="Pagamento a combinar." checked onchange="atualizarTermosCompletos()">
              <span>Pagamento a combinar.</span>
            </label>

            <label class="checkbox-row">
              <input type="checkbox" class="term-check" value="Impostos inclusos." checked onchange="atualizarTermosCompletos()">
              <span>Impostos inclusos.</span>
            </label>

            <label class="checkbox-row">
              <input type="checkbox" class="term-check" value="Despesas com deslocamento, alimentação e hotel já incluso no orçamento." checked onchange="atualizarTermosCompletos()">
              <span>Despesas com deslocamento, alimentação e hotel já incluso no orçamento.</span>
            </label>
          </div>

          <div style="background: #F8FAFC; border: 1px solid #CBD5E1; padding: 14px; border-radius: 6px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;">
            <label class="checkbox-row">
              <input type="checkbox" id="checkNotIncluded" checked onchange="atualizarTermosCompletos()">
              <span style="font-weight: bold; color: #0B132B;">Não estão inclusos:</span>
            </label>
            <textarea id="orcNotIncludedText" rows="2" class="form-control" placeholder="óleos, peças, espelhos" style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; font-family:inherit; font-size: 0.83rem; background: #FFFFFF;" oninput="atualizarTermosCompletos()"></textarea>
          </div>

          <label for="orcTerms" style="font-weight: bold; font-size: 0.85rem; color: #334155; margin-top: 10px; display: block;">Resumo das Condições Comerciais:</label>
          <textarea id="orcTerms" rows="4" class="form-control" style="width:100%; box-sizing: border-box; padding:8px; border:1px solid #CBD5E1; border-radius:4px; font-family:inherit; margin-top: 4px; background: #FFFFFF; font-size: 0.85rem;"></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn" style="flex: 1; background-color: #22C55E; color: #FFF; font-weight: bold; padding: 12px 16px; border: none; border-radius: 6px; font-size: 0.95rem; cursor: pointer;">
            Guardar Orçamento
          </button>
          <a href="relatorios.html" class="btn" style="flex: 1; text-align: center; background-color: #64748B; color: #FFF; padding: 12px 16px; text-decoration: none; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
            Cancelar
          </a>
        </div>
      </form>
    </section>

  </main>
