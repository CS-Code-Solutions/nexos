<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="1.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua marca aqui - Histórico de RS</title>
  <link rel="stylesheet" href="style.css">
  <script src="global-modal.js"></script>
<!-- Firebase SDKs Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Inicialização do Firebase -->
<script src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
  <script>
    if (localStorage.getItem('rg_logged') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      header, footer, .no-print, .action-toolbar { display: none !important; }
      body { background: white; color: black; padding: 0; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
    }

    #reportPreviewModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 19, 43, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 15px;
    }
    .modal-content-wrapper {
      background: white;
      width: 100%;
      max-width: 800px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }
    .action-toolbar {
      background: var(--deep-navy);
      color: white;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid var(--electric-cyan);
      flex-shrink: 0;
    }
    .toolbar-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .report-scroll-container { padding: 20px; overflow-y: auto; background: #FFF; flex-grow: 1; position: relative; }

    .watermark {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 85px; font-weight: bold;
      color: rgba(0, 245, 212, 0.025);
      z-index: 0; pointer-events: none;
      text-align: center; white-space: nowrap; text-transform: uppercase; width: 100%;
    }

    .print-body { font-family: Arial, sans-serif; color: #0B132B; line-height: 1.15; font-size: 9px; position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 190mm; margin: 0 auto; padding-bottom: 5px; }
    .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00F5D4; padding-bottom: 4px; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
    .print-header img { height: 30px; width: auto; max-width: 120px; object-fit: contain; }
    .print-header-info { text-align: right; flex-shrink: 0; }
    .print-header-info h1 { font-size: 11px; color: #0B132B; margin: 0; font-weight: bold; white-space: nowrap; }
    
    .section-box { border: 1px solid #CBD5E1; padding: 5px 7px; margin-bottom: 5px; border-radius: 4px; background: #FFFFFF !important; page-break-inside: avoid; break-inside: avoid; }
    .section-title { font-weight: bold; font-size: 9.5px; color: #0B132B; margin-bottom: 2px; border-bottom: 1px solid #CBD5E1; padding-bottom: 2px; background: #FFFFFF !important; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .print-body p { margin: 1px 0; }
    .signature-area { margin-top: 6px; display: flex; justify-content: space-between; align-items: flex-end; page-break-inside: avoid; break-inside: avoid; }
    .signature-box { text-align: center; width: 45%; }
    .signature-box img { max-width: 130px; height: 32px; object-fit: contain; display: block; margin: 0 auto; }
    .page-break { page-break-before: always; }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="marca.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html">Novo Relatório</a></li>
          <li><a href="historico.html" class="active">Histórico RS</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
          <li><a href="login.html" onclick="localStorage.removeItem('rg_logged')" style="color: var(--danger); font-weight: bold;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Histórico de Relatórios de Serviço (RS)</h2>
      <div id="reportCardsContainer" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <p style="text-align: center; color: #64748B;">A carregar histórico da nuvem...</p>
      </div>
    </section>
  </main>

  <div id="reportPreviewModal">
    <div class="modal-content-wrapper">
      <div class="action-toolbar">
        <div>
          <strong id="modalTitleRs" style="color: var(--electric-cyan); font-size: 1rem;">Relatório de Serviço</strong>
          <span id="loadingStatusRs" style="font-size: 0.8rem; margin-left: 8px; color: #FCD34D;">⏳ A preparar...</span>
        </div>
        <div class="toolbar-buttons">
          <button class="btn" style="background-color: #00F5D4; color: #0B132B; font-weight: bold; padding: 6px 12px; font-size: 0.85rem;" onclick="compartilharPDF()">📤 Partilhar PDF</button>
          <button class="btn" style="background-color: #22C55E; color: white; font-weight: bold; padding: 6px 12px; font-size: 0.85rem;" onclick="descarregarPDF()">📥 Descarregar PDF</button>
          <button class="btn" style="background-color: #EF4444; padding: 6px 12px; font-size: 0.85rem;" onclick="closeModal()">✖️ Fechar</button>
        </div>
      </div>
      <div class="report-scroll-container" id="reportScrollContainer">
        <div id="reportRenderArea"></div>
      </div>
    </div>
  </div>

  <footer class="no-print">
    <p>&copy; 2026 — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

 <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
      });
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    let activeReportData = {};

    async function renderHistory() {
      const container = document.getElementById('reportCardsContainer');
      if (!container) return;

      try {
        let reports = await DataSync.load('rg_reports') || [];
        if (!Array.isArray(reports)) reports = [];

        container.innerHTML = '';
        if (reports.length === 0) {
          container.innerHTML = '<p style="text-align: center; color: #64748B;">Nenhum relatório de serviço registado.</p>';
          return;
        }

        let htmlCards = '';
        for (let i = reports.length - 1; i >= 0; i--) {
          const rep = reports[i];
          if (!rep) continue;

          const safeNumber = escapeHTML(rep.number || 'RS-1000');
          const safeDate = escapeHTML(rep.date || '-');
          const safeClient = escapeHTML(rep.client || '-');
          const safeEquipment = escapeHTML(rep.equipment || '-');
          const safeNature = escapeHTML(rep.serviceNature || rep.type || '-');

          htmlCards += `
            <div style="border: 1px solid #CBD5E1; padding: 15px; border-radius: 6px; background: #F8FAFC; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
              <div style="flex: 1; min-width: 220px;">
                <strong style="font-size: 1.05rem; color: #0B132B;">${safeNumber}</strong> — <span style="color: #64748B; font-size: 0.9rem;">${safeDate}</span><br>
                <span style="font-size: 0.9rem; color: #334155;"><strong>Cliente:</strong> ${safeClient}</span><br>
                <span style="font-size: 0.9rem; color: #334155;"><strong>Equipamento:</strong> ${safeEquipment}</span><br>
                <span style="font-size: 0.85rem; color: #0D9488;"><strong>Tipo:</strong> ${safeNature}</span>
              </div>
              <div class="no-print" style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #1D4ED8;" onclick="openReportPreview(${i})">Gerar RS</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #F59E0B;" onclick="editReport(${i})">Editar</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #EF4444;" onclick="deleteReport(${i})">Excluir</button>
              </div>
            </div>
          `;
        }
        container.innerHTML = htmlCards;
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="text-align: center; color: red;">Erro ao carregar dados do histórico.</p>`;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await renderHistory();
      DataSync.listen('rg_reports', () => renderHistory());
    });

    window.deleteReport = async function(index) {
      if(confirm('Deseja realmente excluir este relatório?')) {
        try {
          let reports = await DataSync.load('rg_reports') || [];
          reports.splice(index, 1);
          await DataSync.save('rg_reports', reports);
          renderHistory();
        } catch (e) { alert('Erro ao excluir relatório.'); }
      }
    };

    window.editReport = function(index) {
      window.location.href = `novo-relatorio.html?edit=${index}`;
    };

    function calcularMinutosDiasTrabalho(diasArray, valorHoraFixo = 200.00) {
      let minutosTotais = 0;
      let detalhesDiasHtml = '';

      if (Array.isArray(diasArray)) {
        diasArray.forEach((d, idx) => {
          if (d.inicio && d.fim) {
            const diff = new Date(d.fim) - new Date(d.inicio);
            if (diff > 0) {
              const minDia = diff / (1000 * 60);
              minutosTotais += minDia;
              const hExata = Math.floor(minDia / 60);
              const mRest = Math.round(minDia % 60);
              detalhesDiasHtml += `<span style="display: block; margin-left: 6px;">• Dia ${idx + 1}: ${d.inicio.replace('T', ' ')} até ${d.fim.replace('T', ' ')} (${hExata}h ${mRest}m)</span>`;
            }
          }
        });
      }

      const horasDecimais = minutosTotais / 60;
      const valorHorasTotal = horasDecimais * Number(valorHoraFixo);
      const horasExatas = Math.floor(minutosTotais / 60);
      const minutosRestantes = Math.round(minutosTotais % 60);

      return {
        totalHoursText: `${horasExatas}h ${minutosRestantes}m`,
        valorHorasTotal: valorHorasTotal,
        detalhesDiasHtml: detalhesDiasHtml
      };
    }

    window.openReportPreview = async function(index) {
      try {
        let reports = await DataSync.load('rg_reports') || [];
        const rep = reports[index];
        if (!rep) { alert("Relatório não encontrado."); return; }
        
        const defaultConfig = { 
          name: 'UA MARCA AQUI', 
          tech: 'Sua marca',
          doc: '0000000000/0000000',
          email: 'seuemail@teste.com.br',
          contact: '+55 51 000000000',
          location: 'Rua...',
          techSignature: ''
        };

        let config = { ...defaultConfig };
        try {
          const savedCfg = await DataSync.load('rg_config');
          if (savedCfg) config = { ...defaultConfig, ...savedCfg };
        } catch (e) {}

        let clients = await DataSync.load('rg_clients') || [];
        const clientObj = clients.find(c => c.name === rep.client) || {};

        let valorTotal = 0;
        let textoHoras = "Não cobrado";
        let valorHorasTotal = 0;
        let detalhesDiasHtml = "";

        if (rep.temEmpreitada === 'sim') {
            valorTotal = Number(rep.valorEmpreitada) || 0;
            textoHoras = `Empreitada (R$ ${valorTotal.toFixed(2)})`;
        } else {
            if (rep.temHora === 'sim') {
                const valorHora = Number(rep.valorHora) || 200.00;
                let diasArr = rep.diasTrabalho;
                if (!diasArr && rep.startManha) {
                  diasArr = [{ inicio: rep.startManha, fim: rep.endManha || rep.endTarde }];
                }
                const calc = calcularMinutosDiasTrabalho(diasArr, valorHora);
                valorHorasTotal = calc.valorHorasTotal;
                textoHoras = `${calc.totalHoursText} (R$ ${valorHorasTotal.toFixed(2)})`;
                detalhesDiasHtml = calc.detalhesDiasHtml;
            }
            
            let valorDeslocamentoTotal = 0;
            if (rep.temDeslocamento === 'sim') {
                const valorHDesloc = Number(rep.valorHoraDeslocamento) || 260.00;
                const horasDesloc = Number(rep.tempoDeslocamentoHoras) || 0;
                valorDeslocamentoTotal = valorHDesloc * horasDesloc;
            }

            let valorHospedagemTotal = 0;
            if (rep.temHospedagem === 'sim') {
                valorHospedagemTotal = Number(rep.valorHospedagem) || 0;
            }

            let valorOutrasTotal = 0;
            if (rep.temOutras === 'sim') {
                valorOutrasTotal = Number(rep.valorOutras) || 0;
            }

            valorTotal = valorHorasTotal + valorDeslocamentoTotal + valorHospedagemTotal + valorOutrasTotal;
        }

        const valorTotalStr = valorTotal.toFixed(2);
        activeReportData = { number: rep.number, client: rep.client };

        const deslocamentoHtml = rep.temDeslocamento === 'sim' ? `<p>• <strong>Hora de Deslocamento:</strong> ${rep.tempoDeslocamentoHoras || 0}h a R$ ${Number(rep.valorHoraDeslocamento || 0).toFixed(2)}/h (Total: R$ ${(Number(rep.valorHoraDeslocamento || 0) * Number(rep.tempoDeslocamentoHoras || 0)).toFixed(2)})</p>` : '';
        const hospedagemHtml = rep.temHospedagem === 'sim' ? `<p>• <strong>Hospedagem:</strong> R$ ${Number(rep.valorHospedagem || 0).toFixed(2)}</p>` : '';
        const outrasHtml = rep.temOutras === 'sim' ? `<p>• <strong>Outras Despesas / Alimentação:</strong> R$ ${Number(rep.valorOutras || 0).toFixed(2)}</p>` : '';

        const clientSignature = rep.signature || rep.assinatura || rep.clientSignature || rep.assinaturaCliente || '';
        const techSignature = config.techSignature || '';

        const signatureAreaHtml = `
          <div class="signature-area">
            <div class="signature-box">
              ${techSignature ? `<img src="${techSignature}" alt="Assinatura Técnico">` : '<p style="height: 30px;"></p>'}
              <p>________________________________________</p>
              <p><strong>Técnico Responsável:</strong> ${escapeHTML(config.tech || 'Otávio Barbosa')}</p>
            </div>
            <div class="signature-box">
              ${clientSignature ? `<img src="${clientSignature}" alt="Assinatura Cliente">` : '<p style="height: 30px;"></p>'}
              <p>________________________________________</p>
              <p><strong>Assinatura do Cliente</strong></p>
            </div>
          </div>
        `;

        let anexosHtml = '';
        if (rep.anexos && rep.anexos.length > 0) {
          let itemsHtml = '';
          rep.anexos.forEach(anexo => {
            itemsHtml += `
              <div class="section-box" style="text-align: center; page-break-inside: avoid; margin-top: 6px;">
                <div class="watermark">SUA MARCA AQI</div>
                <div class="section-title" style="text-align: left;">${escapeHTML(anexo.titulo || 'Foto do Equipamento')}</div>
                <img src="${anexo.imagem}" alt="${escapeHTML(anexo.titulo || '')}" style="max-width: 100%; max-height: 220px; height: auto; object-fit: contain; border-radius: 4px; border: 1px solid #CBD5E1; display: block; margin: 0 auto;">
              </div>
            `;
          });
          anexosHtml = `
            <div class="page-break"></div>
            <div class="print-header" style="margin-top: 4px;">
              <img src="marca.png" alt="Logo">
              <div class="print-header-info">
                <h1>ANEXOS / FOTOGRAFIAS DO EQUIPAMENTO</h1>
                <p><strong>RS Nº:</strong> ${escapeHTML(rep.number)} | <strong>Cliente:</strong> ${escapeHTML(rep.client)}</p>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">
              ${itemsHtml}
            </div>
          `;
        }

        const safeRepNum = escapeHTML(rep.number);
        const safeRepDate = escapeHTML(rep.date);
        const safeCfgName = escapeHTML(config.name);
        const safeCfgDoc = escapeHTML(config.doc);
        const safeCfgEmail = escapeHTML(config.email || '-');
        const safeCfgContact = escapeHTML(config.contact);
        const safeCfgLocation = escapeHTML(config.location);
        const safeRepClient = escapeHTML(rep.client);
        const safeClientDoc = escapeHTML(clientObj.doc || clientObj.cnpj || '-');
        const safeClientEmail = escapeHTML(clientObj.email || '-');
        const safeClientAddress = escapeHTML(clientObj.address || '-');
        const safeRepEq = escapeHTML(rep.equipment || '-');
        const safeRepBrand = escapeHTML(rep.brand || '-');
        const safeRepModel = escapeHTML(rep.model || '-');
        const safeRepSerial = escapeHTML(rep.serialNumber || '-');
        const safeServiceNature = escapeHTML(rep.serviceNature || '-');
        const safeServiceArea = escapeHTML(rep.serviceArea || '-');
        const safeDesc = escapeHTML(rep.desc || '-');

        const fullReportHtml = `
          <div class="print-body" id="pdfContentToPrint">
            <div class="watermark">Sua marca aqui</div>

            <div class="print-header">
              <img src="marca.png" alt="Logo">
              <div class="print-header-info">
                <h1>RELATÓRIO DE SERVIÇO (RS)</h1>
                <p><strong>Nº do RS:</strong> ${safeRepNum} | <strong>Data:</strong> ${safeRepDate}</p>
              </div>
            </div>

            <div class="section-box">
              <div class="section-title">Dados da Empresa / Prestador de Serviço</div>
              <div class="grid-2">
                <p><strong>Razão Social:</strong> ${safeCfgName}</p>
                <p><strong>CNPJ:</strong> ${safeCfgDoc}</p>
                <p><strong>E-mail:</strong> ${safeCfgEmail}</p>
                <p><strong>Telefone / WhatsApp:</strong> ${safeCfgContact}</p>
                <p style="grid-column: span 2;"><strong>Endereço:</strong> ${safeCfgLocation}</p>
              </div>
            </div>

            <div class="section-box">
              <div class="section-title">Dados do Cliente</div>
              <div class="grid-2">
                <p><strong>Nome / Razão Social:</strong> ${safeRepClient}</p>
                <p><strong>CPF / CNPJ:</strong> ${safeClientDoc}</p>
                <p><strong>E-mail:</strong> ${safeClientEmail}</p>
                <p><strong>Endereço:</strong> ${safeClientAddress}</p>
              </div>
            </div>

            <div class="section-box">
              <div class="section-title">Dados do Equipamento / Máquina</div>
              <div class="grid-2">
                <p><strong>Equipamento:</strong> ${safeRepEq}</p>
                <p><strong>Marca:</strong> ${safeRepBrand}</p>
                <p><strong>Modelo:</strong> ${safeRepModel}</p>
                <p><strong>Matrícula / N° de Série:</strong> ${safeRepSerial}</p>
              </div>
            </div>

            <div class="section-box">
              <div class="section-title">Registro do Serviço Realizado</div>
              <div class="grid-2" style="margin-bottom: 2px;">
                <p><strong>Tipo de Manutenção:</strong> ${safeServiceNature}</p>
                <p><strong>Área de Serviço:</strong> ${safeServiceArea}</p>
              </div>
              <p><strong>Descrição Detalhada:</strong></p>
              <p style="white-space: pre-wrap; margin-top: 1px; background: #FFF; padding: 3px; border: 1px solid #E2E8F0; border-radius: 4px;">${safeDesc}</p>
            </div>

            <div class="section-box">
              <div class="section-title">Critérios de Cobrança e Valor Total</div>
              <div style="font-size: 9px; margin-bottom: 2px;">
                ${rep.temHora === 'sim' ? `<p>• <strong>Serviço / Horas:</strong> ${textoHoras}</p>${detalhesDiasHtml}` : ''}
                ${deslocamentoHtml}
                ${hospedagemHtml}
                ${outrasHtml}
                ${rep.temEmpreitada === 'sim' ? `<p>• <strong>Regime de Empreitada:</strong> ${textoHoras}</p>` : ''}
              </div>
              <p style="font-size: 9.5px; font-weight: bold; color: #0D9488; border-top: 1px solid #CBD5E1; padding-top: 2px; margin-top: 2px;">Valor Total Estimado: R$ ${valorTotalStr}</p>
            </div>

            ${signatureAreaHtml}
            ${anexosHtml}
          </div>
        `;

        document.getElementById('reportRenderArea').innerHTML = fullReportHtml;
        document.getElementById('modalTitleRs').textContent = `Relatório de Serviço - ${rep.number} (${rep.client})`;
        document.getElementById('loadingStatusRs').textContent = 'Pronto';
        document.getElementById('reportPreviewModal').style.display = 'flex';
      } catch (err) {
        console.error(err);
        alert("Erro ao abrir pré-visualização do relatório.");
      }
    };

    window.closeModal = function() {
      document.getElementById('reportPreviewModal').style.display = 'none';
    };

    window.compartilharPDF = async function() {
      const element = document.getElementById('reportRenderArea');
      const filename = `Relatorio_RS_${activeReportData.number || 'RS-1000'}.pdf`;
      const opt = {
        margin: [6, 6, 6, 6],
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, allowTaint: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      document.getElementById('loadingStatusRs').textContent = 'A gerar PDF...';

      try {
        const worker = html2pdf().from(element).set(opt);
        const pdfBlob = await worker.outputPdf('blob');
        const file = new File([pdfBlob], filename, { type: 'application/pdf' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: `Relatório de Serviço ${activeReportData.number || ''}`,
            text: `Segue em anexo o Relatório de Serviço ${activeReportData.number || ''} para o cliente ${activeReportData.client || ''}.`
          });
          document.getElementById('loadingStatusRs').textContent = 'Partilhado!';
        } else {
          worker.save();
          document.getElementById('loadingStatusRs').textContent = 'Guardado (Download)!';
        }
      } catch (err) {
        console.error("Erro ou cancelamento na partilha:", err);
        if (err.name !== 'AbortError') {
          html2pdf().from(element).set(opt).save();
          document.getElementById('loadingStatusRs').textContent = 'Guardado (Download)!';
        } else {
          document.getElementById('loadingStatusRs').textContent = 'Partilha cancelada.';
        }
      }
    };

    window.descarregarPDF = function() {
      const element = document.getElementById('reportRenderArea');
      const filename = `Relatorio_RS_${activeReportData.number || 'RS-1000'}.pdf`;
      const opt = {
        margin: [6, 6, 6, 6],
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, allowTaint: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      document.getElementById('loadingStatusRs').textContent = 'A descarregar...';
      html2pdf().from(element).set(opt).save().then(() => {
        document.getElementById('loadingStatusRs').textContent = 'Descarregado!';
      });
    };
  </script>
</body>
</html>
