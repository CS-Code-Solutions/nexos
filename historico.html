<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  (function() {
    const logoSalva = localStorage.getItem('rg_logo_base64');
    if (logoSalva && logoSalva.startsWith('data:image')) {
      document.write('<style>#logo-cliente { content: url("' + logoSalva + '"); }</style>');
    }
  })();
</script>

  <link rel="icon" href="nexosico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexOS - Histórico de RS</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome para os ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="global-modal.js"></script>
  
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Inicialização do Firebase e Sincronização -->
  <script src="firebase-init.js?v=2"></script>
  <script src="firebase-sync.js?v=2"></script>

  <!-- html2pdf CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* Estilos do Menu Desktop e Responsividade */
    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .desktop-nav a {
      color: #94A3B8;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .desktop-nav a:hover, 
    .desktop-nav a.active {
      color: #00F5D4;
    }
    @media (max-width: 768px) {
      .desktop-nav {
        display: none !important;
      }
    }
    @media (min-width: 769px) {
      #mainBottomNav {
        display: none !important;
      }
    }

    @media print {
      header, footer, .no-print, .action-toolbar { display: none !important; }
      body { background: white; color: black; padding: 0; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
    }

    #reportPreviewModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 19, 43, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      overflow-y: auto;
      padding: 15px;
    }
    .modal-content-wrapper {
      background: white;
      width: 100%;
      max-width: 800px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      overflow: hidden;
    }
    .action-toolbar {
      background: var(--deep-navy);
      color: white;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 2px solid var(--electric-cyan);
      flex-shrink: 0;
    }
    .toolbar-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .report-scroll-container { padding: 20px; overflow-y: auto; background: #FFF; flex-grow: 1; position: relative; }

    .watermark {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 85px; font-weight: bold;
      color: rgba(0, 245, 212, 0.035);
      z-index: 0; pointer-events: none;
      text-align: center; white-space: nowrap; text-transform: uppercase; width: 100%;
    }

    .print-body { font-family: Arial, sans-serif; color: #0B132B; line-height: 1.15; font-size: 9px; position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 190mm; margin: 0 auto; padding-bottom: 5px; }
    .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00F5D4; padding-bottom: 4px; margin-bottom: 6px; width: 100%; box-sizing: border-box; }
    .print-header img { height: 30px; width: auto; max-width: 120px; object-fit: contain; }
    .print-header-info { text-align: right; flex-shrink: 0; }
    .print-header-info h1 { font-size: 11px; color: #0B132B; margin: 0; font-weight: bold; white-space: nowrap; }
    
    .section-box { border: 1px solid #CBD5E1; padding: 5px 7px; margin-bottom: 5px; border-radius: 4px; background: #FFFFFF !important; page-break-inside: avoid; break-inside: avoid; }
    .section-title { font-weight: bold; font-size: 9.5px; color: #0B132B; margin-bottom: 2px; border-bottom: 1px solid #CBD5E1; padding-bottom: 2px; background: #FFFFFF !important; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .print-body p { margin: 1px 0; font-size: 9px; }
    .signature-area { margin-top: 6px; display: flex; justify-content: space-between; align-items: flex-end; page-break-inside: avoid; break-inside: avoid; }
    .signature-box { text-align: center; width: 45%; font-size: 9px; }
    .signature-box img { max-width: 130px; height: 32px; object-fit: contain; display: block; margin: 0 auto; }
    .page-break { page-break-before: always; }
  </style>
</head>
<body>

  <!-- CABEÇALHO COM MENU DESKTOP E MOBILE INTEGRADO -->
  <header class="no-print" style="background-color: #0B132B; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #00F5D4; position: sticky; top: 0; z-index: 100;">
    
    <!-- LADO ESQUERDO: LOGO -->
    <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
      <img id="logo-cliente" src="marca.png" alt="NexOS" style="max-height: 35px; width: auto; object-fit: contain; background: transparent;">
    </a>

    <!-- CENTRO: MENU DESKTOP (Aparece no PC) -->
    <nav class="desktop-nav">
      <a href="index.html"><i class="fa-solid fa-users"></i> Clientes</a>
      <a href="maquinas.html"><i class="fa-solid fa-gears"></i> Máquinas</a>
      <a href="historico.html" class="active"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
      <a href="manutencoes.html"><i class="fa-solid fa-calendar-check"></i> Planejamento</a>
      <a href="orcamentos.html" id="d-nav-orcamentos"><i class="fa-solid fa-calculator"></i> Orçamentos</a>
      <a href="horas-extras.html" id="d-nav-horas"><i class="fa-solid fa-clock"></i> Horas</a>
      <a href="configuracao.html"><i class="fa-solid fa-gear"></i> Config</a>
    </nav>

    <!-- LADO DIREITO: BOTÃO SAIR -->
    <button type="button" onclick="fazerLogout();" style="background: transparent; border: none; color: #EF4444; font-size: 1.4rem; cursor: pointer; transition: color 0.2s;" title="Encerrar Sessão">
      <i class="fa-solid fa-power-off"></i>
    </button>
  </header>

  <main style="padding-top: 20px; padding-bottom: 80px;">
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <h2 style="color: #0B132B; margin: 0; font-size: 1.5rem;">Histórico de Relatórios</h2>
        <a href="novo-relatorio.html" class="btn" style="background-color: var(--electric-cyan); color: var(--deep-navy); font-weight: bold; text-decoration: none; padding: 10px 18px; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-plus"></i> Novo Relatório
        </a>
      </div>

      <div id="reportCardsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;">
        <p style="text-align: center; color: #64748B; grid-column: 1 / -1;">A carregar histórico da nuvem...</p>
      </div>
    </section>
  </main>

  <div id="reportPreviewModal">
    <div class="modal-content-wrapper">
      <div class="action-toolbar">
        <div>
          <strong id="modalTitleRs" style="color: var(--electric-cyan); font-size: 1rem;">Relatório de Serviço</strong>
          <span id="loadingStatusRs" style="font-size: 0.8rem; margin-left: 8px; color: #FCD34D;">⏳ A preparar...</span>
        </div>
        <div class="toolbar-buttons">
          <button class="btn" style="background-color: #00F5D4; color: #0B132B; font-weight: bold; padding: 6px 12px; font-size: 0.85rem;" onclick="compartilharPDF()">📤 Partilhar PDF</button>
          <button class="btn" style="background-color: #22C55E; color: white; font-weight: bold; padding: 6px 12px; font-size: 0.85rem;" onclick="descarregarPDF()">📥 Descarregar</button>
          <button class="btn" style="background-color: #EF4444; color: white; padding: 6px 12px; font-size: 0.85rem;" onclick="closeModal()">✖ Fechar</button>
        </div>
      </div>
      <div class="report-scroll-container" id="reportScrollContainer">
        <div id="reportRenderArea"></div>
      </div>
    </div>
  </div>

  <footer class="no-print">
    <p>&copy; 2026 NexOS | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #00F5D4; text-decoration: none;"><strong>CS Code Solutions</strong></a></p>
  </footer>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR (Apenas Mobile) -->
  <nav class="bottom-nav no-print" id="mainBottomNav">
    <a href="index.html">
      <i class="fa-solid fa-users"></i>
      <span>Clientes</span>
    </a>
    <a href="maquinas.html">
      <i class="fa-solid fa-gears"></i>
      <span>Máquinas</span>
    </a>
    <a href="historico.html" class="active">
      <i class="fa-solid fa-file-lines"></i>
      <span>Relatórios</span>
    </a>
    <a href="orcamentos.html" id="nav-item-orcamentos">
      <i class="fa-solid fa-calculator"></i>
      <span>Orçamentos</span>
    </a>
    <a href="horas-extras.html" id="nav-item-horas">
      <i class="fa-solid fa-clock"></i>
      <span>Horas</span>
    </a>
    <a href="configuracao.html" id="nav-item-config">
      <i class="fa-solid fa-gear"></i>
      <span>Config</span>
    </a>
  </nav>

  <!-- SCRIPT EXTERNO SEPARADO PARA OTIMIZAR A VELOCIDADE -->
  <script src="historico.js?v=2"></script>

  <!-- SCRIPT DE CONTROLO DE PERMISSÕES E LOGÓTIPO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const imgLogo = document.getElementById('logo-cliente');
      if (imgLogo) {
        const logoSalva = localStorage.getItem('rg_logo_base64');
        if (logoSalva && logoSalva.startsWith('data:image')) {
          imgLogo.src = logoSalva;
        } else {
          imgLogo.src = 'marca.png';
        }
      }

      const showOrcamentos = localStorage.getItem('rg_page_orcamentos');
      const showHoras = localStorage.getItem('rg_mod_horas_extras');
      const userRole = localStorage.getItem('rg_user_role');
      const isSuperAdmin = (userRole === 'super_admin');

      const navOrcamentos = document.getElementById('nav-item-orcamentos');
      const navHoras = document.getElementById('nav-item-horas');
      const dNavOrcamentos = document.getElementById('d-nav-orcamentos');
      const dNavHoras = document.getElementById('d-nav-horas');

      if (navOrcamentos) navOrcamentos.style.display = (!isSuperAdmin && showOrcamentos === 'false') ? 'none' : 'flex';
      if (navHoras) navHoras.style.display = (isSuperAdmin || showHoras === 'true') ? 'flex' : 'none';
      if (dNavOrcamentos) dNavOrcamentos.style.display = (!isSuperAdmin && showOrcamentos === 'false') ? 'none' : 'flex';
      if (dNavHoras) dNavHoras.style.display = (isSuperAdmin || showHoras === 'true') ? 'flex' : 'none';
    });
  </script>

  <!-- SCRIPT SÍNCRONO INSTANTÂNEO (Elimina piscada dos botões) -->
  <script>
    (function() {
      const showOrcamentos = localStorage.getItem('rg_page_orcamentos');
      const showHoras = localStorage.getItem('rg_mod_horas_extras');
      const userRole = localStorage.getItem('rg_user_role');
      const isSuperAdmin = (userRole === 'super_admin');

      if (!isSuperAdmin && showOrcamentos === 'false') {
        document.write('<style>#nav-item-orcamentos, #d-nav-orcamentos { display: none !important; }</style>');
      }
      if (!isSuperAdmin && showHoras !== 'true') {
        document.write('<style>#nav-item-horas, #d-nav-horas { display: none !important; }</style>');
      }
    })();
  </script>
</body>
</html>
