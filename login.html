  <!-- Helper global de página inicial e aplicação da logo salva -->
  <script>
    window.getPaginaInicialNexOS = function() {
      const paginaSalva = localStorage.getItem('rg_pagina_inicial');
      if (!paginaSalva || paginaSalva === 'dashboard.html' || paginaSalva === 'manutencao.html') {
        return 'relatorios.html';
      }
      return paginaSalva;
    };

    document.addEventListener('DOMContentLoaded', () => {
      const logoSalva = localStorage.getItem('rg_logo_base64');
      if (logoSalva && logoSalva.startsWith('data:image')) {
        const style = document.createElement('style');
        style.textContent = `#logo-cliente { content: url("${logoSalva}"); }`;
        document.head.appendChild(style);
      }
    });
  </script>

  <!-- Declaração de Ícones e PWA para Desktop e Mobile -->

  <style>
    body {
      background-image: url('loginmob.png');
      background-size: cover;

      background-repeat: no-repeat;

      overflow: hidden;

    .login-card {
      background: rgba(11, 19, 43, 0.95);
      border: 1px solid rgba(0, 245, 212, 0.4); 
      padding: 35px 25px;
      border-radius: 12px;

      width: 88%;
      max-width: 380px;
      text-align: center;
      transition: box-shadow 0.3s ease, border 0.3s ease;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    .login-card:hover {
      border: 1px solid #00F5D4;
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.5), 0 0 10px rgba(0, 245, 212, 0.2) inset;
    }

    .login-card img.logo-login {
      max-width: 220px;
      width: 100%;
      height: auto;
      margin-bottom: 20px;

    }
    .login-card h2 {
      color: #FFFFFF;
      margin-bottom: 20px;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }
    .btn-google {
      width: 100%;
      background-color: #1C2541; 
      color: #FFFFFF;
      font-weight: bold;
      padding: 12px;
      border: 1px solid #00F5D4;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .btn-google:hover {
      background-color: rgba(0, 245, 212, 0.15);
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
    }
    .login-footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #94A3B8;
    }
    .login-footer a {
      color: #00F5D4;
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    #loginError {
      color: #F87171;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: left;
      background: rgba(239, 68, 68, 0.15);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    @media (min-width: 768px) {
      body {
        background-image: url('loginpc.png');
      }
      .login-card {
        max-width: 400px;
        padding: 40px 30px;
      }
    }

  <script src="login.js?v=4"></script>

  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      console.log("[PWA] O navegador está pronto para instalar a aplicação nativamente.");
    });

    window.addEventListener('appinstalled', () => {
      console.log('[PWA] Aplicação instalada nativamente com sucesso!');
      deferredPrompt = null;
    });
  </script>
