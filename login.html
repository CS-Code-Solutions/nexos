<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="1.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OS Flow SaaS - Iniciar Sessão</title>
  <link rel="stylesheet" href="style.css">
  <script src="global-modal.js"></script>
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Inicialização Centralizada -->
  <script src="firebase-init.js"></script>

  <style>
    body {
      background-color: #FFFFFF; /* Fundo branco liso */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .login-card {
      background: #0B132B; /* Fundo escuro para destacar a marca e o LED */
      border: 1px solid rgba(0, 245, 212, 0.2); 
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
      width: 100%;
      max-width: 400px;
      text-align: center;
      transition: box-shadow 0.3s ease, border 0.3s ease;
    }

    /* Efeito de LED estático ao passar o rato */
    .login-card:hover {
      border: 1px solid #00F5D4;
      box-shadow: 0 0 25px rgba(0, 245, 212, 0.5), 0 0 10px rgba(0, 245, 212, 0.2) inset;
    }

    .login-card img.logo-login {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin-bottom: 25px;
    }
    .login-card h2 {
      color: #FFFFFF;
      margin-bottom: 25px;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }
    .btn-google {
      width: 100%;
      background-color: #1C2541; /* Botão ligeiramente mais claro que o card */
      color: #FFFFFF;
      font-weight: bold;
      padding: 13px;
      border: 1px solid #00F5D4;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn-google:hover {
      background-color: rgba(0, 245, 212, 0.15);
      box-shadow: 0 0 15px rgba(0, 245, 212, 0.4);
    }
    .login-footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #94A3B8;
    }
    .login-footer a {
      color: #00F5D4;
      text-decoration: none;
      transition: color 0.2s;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
    #loginError {
      color: #F87171;
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: left;
      background: rgba(239, 68, 68, 0.15);
      padding: 10px;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="marca.png" alt="Sua marca aqui!" class="logo-login">
    <h2>Iniciar Sessão</h2>
    
    <div id="loginError"></div>

    <button type="button" id="btnGoogle" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
      Entrar com Conta Google
    </button>

    <div class="login-footer">
      <p>&copy; 2026 | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank"><strong>CS Code Solutions</strong></a></p>
    </div>
  </div>

  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Nova função de validação conectada à coleção saas_users
    async function validarAcessoSaaS(userEmail) {
      try {
        const docRef = db.collection('saas_users').doc(userEmail);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          const userData = docSnap.data();
          if (userData.status === 'ativo') {
            return userData;
          }
        }
        return false;
      } catch (err) {
        console.error("Erro ao validar acesso SaaS:", err);
        return false;
      }
    }

    // Fluxo de autenticação integrado com a trava do SaaS
    async function handleGoogleLogin() {
      const errorBox = document.getElementById('loginError');
      const btnGoogle = document.getElementById('btnGoogle');

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      try {
        btnGoogle.disabled = true;
        btnGoogle.textContent = 'A ligar à Google...';

        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const user = result.user;

        const acessoSaaS = await validarAcessoSaaS(user.email);
        
        if (!acessoSaaS) {
          await firebase.auth().signOut();
          throw new Error(`Acesso negado: O e-mail (${user.email}) não está registado no sistema ou encontra-se inativo.`);
        }

        // Grava as novas chaves estruturais no LocalStorage
        localStorage.setItem('rg_logged', 'true');
        localStorage.setItem('rg_user_email', escapeHTML(user.email));
        localStorage.setItem('rg_user_uid', escapeHTML(user.uid));
        localStorage.setItem('rg_tenant_id', escapeHTML(acessoSaaS.tenant_id));
        localStorage.setItem('rg_user_role', escapeHTML(acessoSaaS.role));
        
        window.location.href = 'index.html';

      } catch (error) {
        console.error("Erro no login Google:", error);
        errorBox.textContent = error.message || 'Erro ao autenticar com a conta Google.';
        errorBox.style.display = 'block';
        btnGoogle.disabled = false;
        btnGoogle.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg> Entrar com Conta Google`;
      }
    }
  </script>

</body>
</html>
