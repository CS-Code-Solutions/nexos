<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Digital de Contrato - CS Code Solutions</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Bibliotecas PDF-Lib e PDF.js para renderização nativa -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --accent: #00F5D4;
      --accent-blue: #38BDF8;
      --text: #F8FAFC;
      --text-sub: #94A3B8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .header {
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .header h1 { font-size: 1.3rem; color: var(--accent-blue); margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: var(--text-sub); }

    /* Caixa de pré-visualização direta via PDF.js */
    .pdf-container {
      width: 100%;
      background: #0B0F19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      max-height: 450px;
      overflow-y: auto;
    }
    #pdfCanvas {
      width: 100% !important;
      height: auto !important;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .pdf-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #0F172A;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .btn-page {
      background: var(--border);
      color: #FFF;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-page:hover { background: var(--accent-blue); color: #0F172A; }

    .form-group { margin-bottom: 15px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0F172A;
      color: #FFF;
      font-size: 0.95rem;
    }

    .signature-area {
      background: #0F172A;
      border: 2px dashed var(--accent-blue);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .signature-area p { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; }
    .signature-canvas {
      background: #FFFFFF;
      border-radius: 6px;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      max-width: 450px;
      height: 150px;
      display: block;
      margin: 0 auto;
    }

    .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
    .btn {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-clear { background: #64748B; color: #FFF; }
    .btn-submit { background: var(--accent); color: #0F172A; width: 100%; justify-content: center; }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: 12px;
      max-width: 420px;
      width: 90%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Assinatura de Contrato Comercial</h1>
      <p>Service JLB Ltda | CS Code Solutions</p>
    </div>

    <!-- Pré-visualização Direta do PDF na Página -->
    <div class="pdf-controls" id="pdfControls" style="display: none;">
      <button type="button" class="btn-page" onclick="mudarPagina(-1)"><i class="fa-solid fa-chevron-left"></i> Anterior</button>
      <span>Página <span id="pageNum">1</span> de <span id="pageCount">?</span></span>
      <button type="button" class="btn-page" onclick="mudarPagina(1)">Seguinte <i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="pdf-container">
      <canvas id="pdfCanvas"></canvas>
    </div>

    <!-- Nome do Responsável -->
    <div class="form-group">
      <label for="signerName">Nome Completo do Responsável:</label>
      <input type="text" id="signerName" placeholder="Ex: Jean Luc Bouchard">
    </div>

    <!-- Quadro de Assinatura -->
    <div class="signature-area">
      <p><i class="fa-solid fa-pen-nib"></i> Desenhe a sua assinatura no quadro abaixo:</p>
      <canvas id="signatureCanvas" class="signature-canvas" width="450" height="150"></canvas>
    </div>

    <div class="btn-group" style="margin-bottom: 10px;">
      <button type="button" class="btn btn-clear" onclick="clearSignature()" style="width: 100%; justify-content: center;">
        <i class="fa-solid fa-eraser"></i> Limpar Quadro
      </button>
    </div>

    <button type="button" class="btn btn-submit" onclick="processarAssinatura()">
      <i class="fa-solid fa-check-double"></i> Confirmar e Descarregar Contrato Assinado
    </button>
  </div>

  <!-- Modal de Carregamento -->
  <div id="statusOverlay" class="overlay">
    <div class="modal-box">
      <i id="statusIcon" class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 15px;"></i>
      <h3 id="statusTitle" style="margin-bottom: 10px; color: #FFF;">A processar assinatura...</h3>
      <p id="statusMsg" style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 15px;">A carimbar o documento de segurança.</p>
    </div>
  </div>

  <script>
    let pdfDocGlobal = null;
    let paginaAtual = 1;
    let totalPaginas = 0;
    let pdfOriginalUrl = '';
    let isSigned = false;

    const canvasSig = document.getElementById('signatureCanvas');
    const ctxSig = canvasSig.getContext('2d');
    let isDrawing = false;

    document.addEventListener("DOMContentLoaded", async () => {
      initCanvas();
      
      const urlParams = new URLSearchParams(window.location.search);
      const contractId = urlParams.get('id') || 'CONTRATO_JLB_2026';
      
      pdfOriginalUrl = new URL(`./contratos/${contractId}.pdf`, window.location.href).href;
      
      // Carrega e desenha o PDF diretamente na página
      await carregarEVisualizarPdf(pdfOriginalUrl);
    });

    async function carregarEVisualizarPdf(url) {
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        pdfDocGlobal = await loadingTask.promise;
        totalPaginas = pdfDocGlobal.numPages;
        
        document.getElementById('pageCount').textContent = totalPaginas;
        if (totalPaginas > 1) {
          document.getElementById('pdfControls').style.display = 'flex';
        }

        renderizarPaginaPdf(paginaAtual);
      } catch (err) {
        console.error("Erro ao carregar pré-visualização do PDF:", err);
      }
    }

    async function renderizarPaginaPdf(num) {
      const page = await pdfDocGlobal.getPage(num);
      const viewport = page.getViewport({ scale: 1.2 });
      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');

      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const renderContext = {
        canvasContext: context,
        viewport: viewport
      };
      await page.render(renderContext).promise;
      document.getElementById('pageNum').textContent = num;
    }

    function mudarPagina(direcao) {
      if (!pdfDocGlobal) return;
      const novaPagina = paginaAtual + direcao;
      if (novaPagina >= 1 && novaPagina <= totalPaginas) {
        paginaAtual = novaPagina;
        renderizarPaginaPdf(paginaAtual);
      }
    }

    function initCanvas() {
      function getPos(e) {
        const rect = canvasSig.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvasSig.width / rect.width),
          y: (clientY - rect.top) * (canvasSig.height / rect.height)
        };
      }

      function startDraw(e) { 
        if (e.cancelable) e.preventDefault();
        isDrawing = true; 
        isSigned = true; 
        const p = getPos(e); 
        ctxSig.beginPath(); 
        ctxSig.moveTo(p.x, p.y); 
      }

      function moveDraw(e) { 
        if (e.cancelable) e.preventDefault();
        if (!isDrawing) return; 
        const p = getPos(e); 
        ctxSig.lineWidth = 3; 
        ctxSig.lineCap = 'round'; 
        ctxSig.strokeStyle = '#0F172A'; 
        ctxSig.lineTo(p.x, p.y); 
        ctxSig.stroke(); 
      }

      function stopDraw(e) { 
        if (e.cancelable) e.preventDefault();
        isDrawing = false; 
      }

      canvasSig.addEventListener('mousedown', startDraw);
      canvasSig.addEventListener('mousemove', moveDraw);
      canvasSig.addEventListener('mouseup', stopDraw);
      canvasSig.addEventListener('mouseout', stopDraw);

      canvasSig.addEventListener('touchstart', startDraw, { passive: false });
      canvasSig.addEventListener('touchmove', moveDraw, { passive: false });
      canvasSig.addEventListener('touchend', stopDraw, { passive: false });
      canvasSig.addEventListener('touchcancel', stopDraw, { passive: false });
    }

    function clearSignature() {
      ctxSig.clearRect(0, 0, canvasSig.width, canvasSig.height);
      isSigned = false;
    }

    async function processarAssinatura() {
      const nome = document.getElementById('signerName').value.trim();

      if (!nome) {
        alert("Por favor, preencha o Nome do Responsável.");
        return;
      }

      if (!isSigned) {
        alert("Por favor, desenhe a sua assinatura no quadro.");
        return;
      }

      document.getElementById('statusOverlay').style.display = 'flex';

      try {
        const response = await fetch(pdfOriginalUrl);
        const pdfArrayBuffer = await response.arrayBuffer();
        
        const pdfDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer);
        const signatureBase64 = canvasSig.toDataURL('image/png');
        const signatureImage = await pdfDoc.embedPng(signatureBase64);

        const pages = pdfDoc.getPages();
        const lastPage = pages[pages.length - 1];

        lastPage.drawImage(signatureImage, {
          x: 100,
          y: 110,
          width: 180,
          height: 60,
        });

        const dataHoraStr = new Date().toLocaleString('pt-BR');
        const textoAuditoria = `Assinado digitalmente por: ${nome}\nData/Hora: ${dataHoraStr}\nPlataforma NexOS - CS Code Solutions`;

        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        lastPage.drawText(textoAuditoria, {
          x: 100,
          y: 85,
          size: 7,
          font: font,
          color: PDFLib.rgb(0.2, 0.2, 0.2),
          lineHeight: 9
        });

        const pdfAssinadoBytes = await pdfDoc.save();
        const pdfBlob = new Blob([pdfAssinadoBytes], { type: 'application/pdf' });
        
        const downloadUrl = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `Contrato_Service_JLB_Assinado.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        document.getElementById('statusOverlay').style.display = 'none';
        alert("Contrato assinado e descarregado com sucesso!");
      } catch (err) {
        document.getElementById('statusOverlay').style.display = 'none';
        alert("Erro ao processar assinatura: " + err.message);
      }
    }
  </script>
</body>
</html>
