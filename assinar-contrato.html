<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Digital - CS Code Solutions</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg-dark: #0F172A;
      --card-bg: #1E293B;
      --accent: #00F5D4;
      --accent-blue: #38BDF8;
      --text: #F8FAFC;
      --text-sub: #94A3B8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .header { text-align: center; padding-bottom: 15px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .header h1 { font-size: 1.3rem; color: var(--accent-blue); margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: var(--text-sub); }
    
    .pdf-box {
      background: #0B0F19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-pdf {
      background: var(--accent-blue);
      color: #0F172A;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0F172A;
      color: #FFF;
      font-size: 0.95rem;
    }
    .signature-area {
      background: #0F172A;
      border: 2px dashed var(--accent-blue);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .signature-area p { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; }
    .signature-canvas {
      background: #FFFFFF;
      border-radius: 6px;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      max-width: 450px;
      height: 150px;
      display: block;
      margin: 0 auto;
    }
    .btn-group { display: flex; gap: 10px; justify-content: flex-end; }
    .btn {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-clear { background: #64748B; color: #FFF; }
    .btn-submit { background: var(--accent); color: #0F172A; width: 100%; justify-content: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Assinatura de Contrato Comercial</h1>
      <p>Service JLB Ltda | CS Code Solutions</p>
    </div>

    <div class="pdf-box">
      <p style="color: #94A3B8; font-size: 0.9rem; margin-bottom: 5px;">Consulte os valores e termos acordados:</p>
      <a id="linkPdf" href="#" target="_blank" class="btn-pdf">
        <i class="fa-solid fa-file-pdf"></i> Abrir Contrato / Proposta em PDF
      </a>
    </div>

    <div class="form-group">
      <label for="signerName">Nome Completo do Responsável:</label>
      <input type="text" id="signerName" placeholder="Ex: Jean Luc Bouchard">
    </div>

    <div class="signature-area">
      <p><i class="fa-solid fa-pen-nib"></i> Desenhe a sua assinatura no quadro abaixo:</p>
      <canvas id="signatureCanvas" class="signature-canvas" width="450" height="150"></canvas>
    </div>

    <div class="btn-group" style="margin-bottom: 10px;">
      <button type="button" class="btn btn-clear" onclick="clearSignature()" style="width: 100%; justify-content: center;">
        <i class="fa-solid fa-eraser"></i> Limpar Quadro
      </button>
    </div>

    <button type="button" class="btn btn-submit" onclick="processarAssinatura()">
      <i class="fa-solid fa-check-double"></i> Confirmar e Descarregar Contrato Assinado
    </button>
  </div>

  <script>
    let pdfOriginalUrl = '';
    let isSigned = false;
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    document.addEventListener("DOMContentLoaded", () => {
      initCanvas();
      
      // Define a rota do PDF de forma totalmente segura na raiz
      const urlParams = new URLSearchParams(window.location.search);
      const contractId = urlParams.get('id') || 'CONTRATO_JLB_2026';
      
      pdfOriginalUrl = new URL(`./contratos/${contractId}.pdf`, window.location.href).href;
      document.getElementById('linkPdf').href = pdfOriginalUrl;
    });

    function initCanvas() {
      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function startDraw(e) { 
        if (e.cancelable) e.preventDefault();
        isDrawing = true; 
        isSigned = true; 
        const p = getPos(e); 
        ctx.beginPath(); 
        ctx.moveTo(p.x, p.y); 
      }

      function moveDraw(e) { 
        if (e.cancelable) e.preventDefault();
        if (!isDrawing) return; 
        const p = getPos(e); 
        ctx.lineWidth = 3; 
        ctx.lineCap = 'round'; 
        ctx.strokeStyle = '#0F172A'; 
        ctx.lineTo(p.x, p.y); 
        ctx.stroke(); 
      }

      function stopDraw(e) { 
        if (e.cancelable) e.preventDefault();
        isDrawing = false; 
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseout', stopDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', stopDraw, { passive: false });
      canvas.addEventListener('touchcancel', stopDraw, { passive: false });
    }

    function clearSignature() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      isSigned = false;
    }

    async function processarAssinatura() {
      const nome = document.getElementById('signerName').value.trim();

      if (!nome) {
        alert("Por favor, preencha o Nome do Responsável.");
        return;
      }

      if (!isSigned) {
        alert("Por favor, desenhe a sua assinatura no quadro.");
        return;
      }

      try {
        alert("A gerar documento assinado, aguarde um instante...");
        
        const response = await fetch(pdfOriginalUrl);
        if (!response.ok) throw new Error("Não foi possível transferir o PDF base.");
        const pdfArrayBuffer = await response.arrayBuffer();
        
        const pdfDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer);
        const signatureBase64 = canvas.toDataURL('image/png');
        const signatureImage = await pdfDoc.embedPng(signatureBase64);

        const pages = pdfDoc.getPages();
        const lastPage = pages[pages.length - 1];

        // Posiciona a assinatura na última página
        lastPage.drawImage(signatureImage, {
          x: 100,
          y: 110,
          width: 180,
          height: 60,
        });

        const dataHoraStr = new Date().toLocaleString('pt-BR');
        const textoAuditoria = `Assinado digitalmente por: ${nome}\nData/Hora: ${dataHoraStr}\nPlataforma NexOS - CS Code Solutions`;

        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        lastPage.drawText(textoAuditoria, {
          x: 100,
          y: 85,
          size: 7,
          font: font,
          color: PDFLib.rgb(0.2, 0.2, 0.2),
          lineHeight: 9
        });

        const pdfAssinadoBytes = await pdfDoc.save();
        const pdfBlob = new Blob([pdfAssinadoBytes], { type: 'application/pdf' });
        
        // Dispara o download automático do PDF assinado
        const downloadUrl = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `Contrato_Service_JLB_Assinado.pdf`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        alert("Contrato assinado e descarregado com sucesso!");
      } catch (err) {
        alert("Erro ao processar assinatura: " + err.message);
      }
    }
  </script>
</body>
</html>
