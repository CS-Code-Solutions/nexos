<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="1.png" type="image/png">
<!-- Firebase SDKs Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="global-modal.js"></script>
<!-- Inicialização do Firebase -->
<script src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
  <script>
    if (localStorage.getItem('rg_logged') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua marca aqui - Cadastro de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="marca.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html" class="active">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html">Novo Relatório</a></li>
          <li><a href="historico.html">Histórico RS</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
          <li><a href="login.html" onclick="localStorage.removeItem('rg_logged')" style="color: var(--danger); font-weight: bold;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Adicionar Novo Cliente</h2>
      <form id="clientForm">
        <input type="hidden" id="editIndex" value="">
        <div class="form-group">
          <label for="clientName">Nome / Razão Social</label>
          <input type="text" id="clientName" required placeholder="Ex: Empresa Exemplo Lda">
        </div>
        <div class="form-group">
          <label for="clientEmail">E-mail</label>
          <input type="email" id="clientEmail" placeholder="exemplo@email.com">
        </div>
        <div class="form-group">
          <label for="clientDoc">CPF / CNPJ</label>
          <input type="text" id="clientDoc" required placeholder="00.000.000/0001-00">
        </div>
        <div class="form-group">
          <label for="clientAddress">Morada / Endereço</label>
          <input type="text" id="clientAddress" placeholder="Rua, Número, Cidade">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
          <button type="submit" class="btn" id="saveBtn" style="background-color: #10B981;">Salvar Cliente</button>
          <button type="button" class="btn" id="cancelBtn" style="background-color: #64748B; display: none;" onclick="resetForm()">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Clientes Cadastrados</h2>
      <div id="clientListContainer" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <p style="text-align: center; color: #64748B;">A carregar clientes da nuvem...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

 <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
      });
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const form = document.getElementById('clientForm');
    const clientListContainer = document.getElementById('clientListContainer');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const editIndexInput = document.getElementById('editIndex');

    let clients = [];

    async function renderClients() {
      try {
        clients = await DataSync.load('rg_clients') || [];
        if (!Array.isArray(clients)) clients = [];

        clientListContainer.innerHTML = '';
        if (clients.length === 0) {
          clientListContainer.innerHTML = '<p style="text-align: center; color: #64748B;">Nenhum cliente cadastrado.</p>';
          return;
        }

        clients.forEach((c, index) => {
          const safeName = escapeHTML(c.name);
          const safeDoc = escapeHTML(c.doc);
          const safeEmail = escapeHTML(c.email || '-');
          const safeAddress = escapeHTML(c.address || '-');

          clientListContainer.innerHTML += `
            <div style="border: 1px solid #CBD5E1; padding: 15px; border-radius: 6px; background: #F8FAFC; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
              <div style="flex: 1; min-width: 220px;">
                <strong style="font-size: 1.05rem; color: #0B132B;">${safeName}</strong><br>
                <span style="font-size: 0.9rem; color: #475569;"><strong>Documento:</strong> ${safeDoc} | <strong>E-mail:</strong> ${safeEmail}</span><br>
                <span style="font-size: 0.9rem; color: #475569;"><strong>Endereço:</strong> ${safeAddress}</span>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #F59E0B;" onclick="editClient(${index})">Editar</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #EF4444;" onclick="deleteClient(${index})">Excluir</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
        clientListContainer.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar clientes.</p>';
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await renderClients();
      DataSync.listen('rg_clients', () => { renderClients(); });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editIdx = editIndexInput.value;
      
      const clientData = {
        name: document.getElementById('clientName').value.trim(),
        email: document.getElementById('clientEmail').value.trim(),
        doc: document.getElementById('clientDoc').value.trim(),
        address: document.getElementById('clientAddress').value.trim()
      };

      try {
        clients = await DataSync.load('rg_clients') || [];
        if (!Array.isArray(clients)) clients = [];

        if (editIdx === "") {
          clients.push(clientData);
        } else {
          clients[editIdx] = clientData;
        }

        await DataSync.save('rg_clients', clients);
        resetForm();
        renderClients();
        alert('Cliente salvo e sincronizado com sucesso!');
      } catch (err) {
        alert('Erro ao salvar cliente: ' + err.message);
      }
    });

    window.editClient = function(index) {
      const c = clients[index];
      if (!c) return;
      document.getElementById('clientName').value = c.name || '';
      document.getElementById('clientEmail').value = c.email || '';
      document.getElementById('clientDoc').value = c.doc || '';
      document.getElementById('clientAddress').value = c.address || '';
      editIndexInput.value = index;
      
      formTitle.textContent = "Editar Cliente";
      saveBtn.textContent = "Atualizar Cliente";
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.resetForm = function() {
      form.reset();
      editIndexInput.value = "";
      formTitle.textContent = "Adicionar Novo Cliente";
      saveBtn.textContent = "Salvar Cliente";
      cancelBtn.style.display = 'none';
    };

    window.deleteClient = async function(index) {
      if (confirm('Deseja realmente excluir este cliente?')) {
        try {
          clients = await DataSync.load('rg_clients') || [];
          clients.splice(index, 1);
          await DataSync.save('rg_clients', clients);
          renderClients();
        } catch (err) {
          alert('Erro ao excluir cliente.');
        }
      }
    };
  </script>

</body>
</html>
