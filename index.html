<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexOS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B132B">
  <script>
    (function() {
      const logado = localStorage.getItem('rg_logged') === 'true';
      if (!logado) {
        window.location.replace('login.html');
        return;
      }

      const paginasValidas = [
        'dashboard.html',
        'relatorios.html',
        'novo-relatorio.html',
        'cadastros.html',
        'manutencoes.html',
        'horas-extras.html'
      ];

      let destino = localStorage.getItem('rg_pagina_inicial') || 'dashboard.html';
      if (!paginasValidas.includes(destino)) {
        destino = 'dashboard.html';
      }

      window.location.replace(destino);
    })();
  </script>
</head>
<body style="background-color: #0B132B; margin: 0;"></body>
</html>
