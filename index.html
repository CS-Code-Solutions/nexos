<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  (function() {
    const logoSalva = localStorage.getItem('rg_logo_base64');
    if (logoSalva && logoSalva.startsWith('data:image')) {
      document.write('<style>#logo-cliente { content: url("' + logoSalva + '"); }</style>');
    }
  })();
</script>

  <link rel="icon" href="nexosico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexOS - Gestão de Clientes</title>
  
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome para os ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="global-modal.js"></script>
  
  <script src="firebase-init.js?v=2"></script>
  <script src="firebase-sync.js?v=2"></script>

  <style>
    /* Estilos do Menu Desktop e Responsividade */
    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .desktop-nav a {
      color: #94A3B8;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s;
    }
    .desktop-nav a:hover, 
    .desktop-nav a.active {
      color: #00F5D4;
    }
    @media (max-width: 768px) {
      .desktop-nav {
        display: none !important;
      }
    }
    @media (min-width: 769px) {
      #mainBottomNav {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO COM MENU DESKTOP E MOBILE INTEGRADO -->
  <header class="no-print" style="background-color: #0B132B; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 2px solid #00F5D4; position: sticky; top: 0; z-index: 100;">
    
    <!-- LADO ESQUERDO: LOGO -->
    <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
      <img id="logo-cliente" src="marca.png" alt="NexOS" style="max-height: 35px; width: auto; object-fit: contain; background: transparent;">
    </a>

    <!-- CENTRO: MENU DESKTOP (Aparece no PC) -->
    <nav class="desktop-nav">
      <a href="index.html" class="active"><i class="fa-solid fa-users"></i> Clientes</a>
      <a href="maquinas.html"><i class="fa-solid fa-gears"></i> Máquinas</a>
      <a href="historico.html"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
      <a href="manutencoes.html"><i class="fa-solid fa-calendar-check"></i> Planejamento</a>
      <a href="orcamentos.html" id="d-nav-orcamentos"><i class="fa-solid fa-calculator"></i> Orçamentos</a>
      <a href="horas-extras.html" id="d-nav-horas"><i class="fa-solid fa-clock"></i> Horas</a>
      <a href="configuracao.html"><i class="fa-solid fa-gear"></i> Config</a>
    </nav>

    <!-- LADO DIREITO: BOTÃO SAIR -->
    <button type="button" onclick="fazerLogout();" style="background: transparent; border: none; color: #EF4444; font-size: 1.4rem; cursor: pointer; transition: color 0.2s;" title="Encerrar Sessão">
      <i class="fa-solid fa-power-off"></i>
    </button>
  </header>

  <main style="padding-top: 20px; padding-bottom: 80px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <h2 style="color: #0B132B; margin: 0; font-size: 1.5rem;">Gestão de Clientes</h2>
      <button type="button" class="btn" onclick="toggleClientForm()" style="background-color: var(--electric-cyan); color: var(--deep-navy); font-weight: bold; padding: 10px 18px;">
        <i class="fa-solid fa-plus"></i> Novo Cliente
      </button>
    </div>

    <!-- FORMULÁRIO OCULTO -->
    <section class="card" id="clientFormSection" style="display: none; border-top: 4px solid var(--electric-cyan);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 id="formTitle" style="margin: 0; color: #0B132B;">Adicionar Cliente</h3>
        <button type="button" onclick="toggleClientForm()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748B;">&times;</button>
      </div>
      
      <form id="clientForm">
        <input type="hidden" id="editIndex" value="">
        <div class="form-group">
          <label for="clientName">Nome / Razão Social</label>
          <input type="text" id="clientName" required placeholder="Ex: Empresa Exemplo Lda">
        </div>
        <div class="form-group">
          <label for="clientEmail">E-mail</label>
          <input type="email" id="clientEmail" placeholder="exemplo@email.com">
        </div>
        <div class="form-group">
          <label for="clientDoc">CPF / CNPJ</label>
          <input type="text" id="clientDoc" required placeholder="00.000.000/0001-00">
        </div>
        <div class="form-group">
          <label for="clientAddress">Morada / Endereço</label>
          <input type="text" id="clientAddress" placeholder="Rua, Número, Cidade">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" class="btn" id="saveBtn" style="background-color: #10B981; font-weight: bold;">Salvar Cliente</button>
          <button type="button" class="btn" id="cancelBtn" style="background-color: #64748B;" onclick="resetForm()">Cancelar</button>
        </div>
      </form>
    </section>

    <section>
      <div id="clientListContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;">
        <p style="text-align: center; color: #64748B; grid-column: 1 / -1;">A carregar clientes da nuvem...</p>
      </div>
    </section>
  </main>

  <footer class="no-print">
    <p>&copy; 2026 NexOS | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" style="color: #00F5D4; text-decoration: none;"><strong>CS Code Solutions</strong></a></p>
  </footer>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR (Apenas Mobile) -->
  <nav class="bottom-nav no-print" id="mainBottomNav">
    <a href="index.html" class="active">
      <i class="fa-solid fa-users"></i>
      <span>Clientes</span>
    </a>
    <a href="maquinas.html">
      <i class="fa-solid fa-gears"></i>
      <span>Máquinas</span>
    </a>
    <a href="historico.html">
      <i class="fa-solid fa-file-lines"></i>
      <span>Relatórios</span>
    </a>
    <a href="orcamentos.html" id="nav-item-orcamentos">
      <i class="fa-solid fa-calculator"></i>
      <span>Orçamentos</span>
    </a>
    <a href="horas-extras.html" id="nav-item-horas">
      <i class="fa-solid fa-clock"></i>
      <span>Horas</span>
    </a>
    <a href="configuracao.html" id="nav-item-config">
      <i class="fa-solid fa-gear"></i>
      <span>Config</span>
    </a>
  </nav>

  <!-- SCRIPT EXTERNO SEPARADO PARA OTIMIZAR A VELOCIDADE -->
  <script src="clientes.js?v=2"></script>

  <!-- SCRIPT DE CONTROLO DE PERMISSÕES E LOGÓTIPO -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const imgLogo = document.getElementById('logo-cliente');
      if (imgLogo) {
        const logoSalva = localStorage.getItem('rg_logo_base64');
        if (logoSalva && logoSalva.startsWith('data:image')) {
          imgLogo.src = logoSalva;
        } else {
          imgLogo.src = 'marca.png';
        }
      }

      const showOrcamentos = localStorage.getItem('rg_page_orcamentos');
      const showHoras = localStorage.getItem('rg_mod_horas_extras');
      const userRole = localStorage.getItem('rg_user_role');
      const isSuperAdmin = (userRole === 'super_admin');

      const navOrcamentos = document.getElementById('nav-item-orcamentos');
      const navHoras = document.getElementById('nav-item-horas');
      const dNavOrcamentos = document.getElementById('d-nav-orcamentos');
      const dNavHoras = document.getElementById('d-nav-horas');

      if (navOrcamentos) navOrcamentos.style.display = (!isSuperAdmin && showOrcamentos === 'false') ? 'none' : 'flex';
      if (navHoras) navHoras.style.display = (isSuperAdmin || showHoras === 'true') ? 'flex' : 'none';
      if (dNavOrcamentos) dNavOrcamentos.style.display = (!isSuperAdmin && showOrcamentos === 'false') ? 'none' : 'flex';
      if (dNavHoras) dNavHoras.style.display = (isSuperAdmin || showHoras === 'true') ? 'flex' : 'none';
    });
  </script>

  <!-- SCRIPT SÍNCRONO INSTANTÂNEO (Elimina piscada dos botões) -->
  <script>
    (function() {
      const showOrcamentos = localStorage.getItem('rg_page_orcamentos');
      const showHoras = localStorage.getItem('rg_mod_horas_extras');
      const userRole = localStorage.getItem('rg_user_role');
      const isSuperAdmin = (userRole === 'super_admin');

      if (!isSuperAdmin && showOrcamentos === 'false') {
        document.write('<style>#nav-item-orcamentos, #d-nav-orcamentos { display: none !important; }</style>');
      }
      if (!isSuperAdmin && showHoras !== 'true') {
        document.write('<style>#nav-item-horas, #d-nav-horas { display: none !important; }</style>');
      }
    })();
  </script>
</body>
</html>
