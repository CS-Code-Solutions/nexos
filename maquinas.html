<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="1.png" type="image/png">
<!-- Firebase SDKs Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Inicialização do Firebase -->
<script src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>
  <script>
    if (localStorage.getItem('rg_logged') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua marca aqui - Cadastro de Máquinas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="marca.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html" class="active">Máquinas</a></li>
          <li><a href="novo-relatorio.html">Novo Relatório</a></li>
          <li><a href="historico.html">Histórico RS</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
          <li><a href="login.html" onclick="localStorage.removeItem('rg_logged')" style="color: var(--danger); font-weight: bold;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Cadastro de Máquinas / Equipamentos</h2>
      <form id="machineForm">
        <input type="hidden" id="editIndex" value="">

        <div class="form-group">
          <label for="machineClient">Cliente / Empresa</label>
          <select id="machineClient" required>
            <option value="">A carregar clientes...</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="machineName">Nome / Equipamento</label>
            <input type="text" id="machineName" required placeholder="Ex: Centro de Usinagem">
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="machineBrand">Marca</label>
            <input type="text" id="machineBrand" placeholder="Ex: Trumpf / Bystronic">
          </div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="machineModel">Modelo</label>
            <input type="text" id="machineModel" placeholder="Ex: TruLaser 3030">
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="machineSerial">Número de Série / Tag</label>
            <input type="text" id="machineSerial" placeholder="Ex: SN-99823">
          </div>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="submit" id="submitBtn" class="btn">Salvar Máquina</button>
          <button type="button" class="btn" style="background-color: #64748B; color: #FFF;" onclick="resetForm()">Cancelar / Limpar</button>
        </div>
      </form>
    </section>

    <!-- Cartões Responsivos para Máquinas -->
    <section class="card">
      <h2>Máquinas Cadastradas</h2>
      <div id="machineCardsContainer" style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <p style="text-align: center; color: #64748B;">A carregar máquinas da nuvem...</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

 <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
      });
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const clientSelect = document.getElementById('machineClient');
    const machineForm = document.getElementById('machineForm');
    const machineCardsContainer = document.getElementById('machineCardsContainer');
    
    let machines = [];
    let clients = [];

    async function loadDropdownClients() {
      try {
        clients = await DataSync.load('rg_clients') || [];
        clientSelect.innerHTML = '<option value="">Selecione o cliente...</option>';
        clients.forEach(c => {
          const option = document.createElement('option');
          option.value = c.name;
          option.textContent = c.name;
          clientSelect.appendChild(option);
        });
      } catch (e) {
        console.error("Erro ao carregar clientes para o select", e);
      }
    }

    async function renderMachines() {
      try {
        machines = await DataSync.load('rg_machines') || [];
        if (!Array.isArray(machines)) machines = [];

        machineCardsContainer.innerHTML = '';
        if (machines.length === 0) {
          machineCardsContainer.innerHTML = '<p style="text-align: center; color: #64748B;">Nenhuma máquina cadastrada.</p>';
          return;
        }

        let htmlCards = '';
        machines.forEach((m, index) => {
          const safeClient = escapeHTML(m.client);
          const safeName = escapeHTML(m.name);
          const safeBrand = escapeHTML(m.brand || '-');
          const safeModel = escapeHTML(m.model || '-');
          const safeSerial = escapeHTML(m.serial || '-');

          htmlCards += `
            <div style="border: 1px solid #CBD5E1; padding: 15px; border-radius: 6px; background: #F8FAFC; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px;">
              <div style="flex: 1; min-width: 220px;">
                <strong style="font-size: 1.05rem; color: #0B132B;">${safeName}</strong> — <span style="color: #64748B; font-size: 0.9rem;">${safeClient}</span><br>
                <span style="font-size: 0.9rem; color: #334155;"><strong>Marca / Modelo:</strong> ${safeBrand} / ${safeModel}</span><br>
                <span style="font-size: 0.85rem; color: #334155;"><strong>Série / Tag:</strong> ${safeSerial}</span>
              </div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #F59E0B;" onclick="editMachine(${index})">Editar</button>
                <button class="btn" style="padding: 6px 12px; font-size: 0.85rem; background-color: #EF4444;" onclick="deleteMachine(${index})">Excluir</button>
              </div>
            </div>
          `;
        });
        machineCardsContainer.innerHTML = htmlCards;
      } catch (err) {
        console.error(err);
        machineCardsContainer.innerHTML = '<p style="text-align: center; color: red;">Erro ao carregar máquinas.</p>';
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await loadDropdownClients();
      await renderMachines();

      DataSync.listen('rg_machines', () => { renderMachines(); });
      DataSync.listen('rg_clients', () => { loadDropdownClients(); });
    });

    machineForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editIndex = document.getElementById('editIndex').value;
      
      const machineData = {
        client: clientSelect.value,
        name: document.getElementById('machineName').value.trim(),
        brand: document.getElementById('machineBrand').value.trim(),
        model: document.getElementById('machineModel').value.trim(),
        serial: document.getElementById('machineSerial').value.trim()
      };

      try {
        machines = await DataSync.load('rg_machines') || [];
        if (!Array.isArray(machines)) machines = [];
        
        if (editIndex !== '') {
          machines[editIndex] = machineData;
          alert('Máquina atualizada e sincronizada com sucesso!');
        } else {
          machines.push(machineData);
          alert('Máquina salva e sincronizada com sucesso!');
        }

        await DataSync.save('rg_machines', machines);
        resetForm();
        renderMachines();
      } catch (err) {
        alert('Erro ao salvar máquina: ' + err.message);
      }
    });

    window.editMachine = async function(index) {
      try {
        machines = await DataSync.load('rg_machines') || [];
        const m = machines[index];
        if (!m) return;

        document.getElementById('editIndex').value = index;
        document.getElementById('formTitle').textContent = 'Editar Máquina / Equipamento';
        document.getElementById('submitBtn').textContent = 'Atualizar Máquina';
        
        document.getElementById('machineClient').value = m.client || '';
        document.getElementById('machineName').value = m.name || '';
        document.getElementById('machineBrand').value = m.brand || '';
        document.getElementById('machineModel').value = m.model || '';
        document.getElementById('machineSerial').value = m.serial || '';

        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        alert('Erro ao carregar máquina para edição.');
      }
    };

    window.resetForm = function() {
      machineForm.reset();
      document.getElementById('editIndex').value = '';
      document.getElementById('formTitle').textContent = 'Cadastro de Máquinas / Equipamentos';
      document.getElementById('submitBtn').textContent = 'Salvar Máquina';
    };

    window.deleteMachine = async function(index) {
      if (confirm('Deseja realmente excluir esta máquina?')) {
        try {
          machines = await DataSync.load('rg_machines') || [];
          machines.splice(index, 1);
          await DataSync.save('rg_machines', machines);
          renderMachines();
        } catch (err) {
          alert('Erro ao excluir máquina.');
        }
      }
    };
  </script>

</body>
</html>
